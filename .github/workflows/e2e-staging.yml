name: E2E (staging)

# Runs the browser tests against the staging deployment: every Sunday at 01:30
# UTC (08:30 in Vietnam), after the blackbox tests of vietmath-backend (01:00
# UTC), and when started by hand (Actions → Run workflow), e.g. after a staging
# deploy. Nothing is started here: the
# tests drive the staging web apps. The values come from repository secrets;
# `make blackbox-env` in vietmath-infra/staging prints the inbox one:
#   E2E_STAGING_BASE_URL       the student web, e.g. https://vietmath-staging.viettechno.com
#   E2E_STAGING_ADMIN_URL      the admin web, e.g. https://vietmath-admin-staging.viettechno.com
#   E2E_STAGING_MAILPIT_URL    https://blackbox:<password>@<the staging Mailpit host>
#                              (percent-encode a password that has special characters; the
#                              generated one is hex and needs nothing)
#   E2E_STAGING_ADMIN_EMAIL    a System Admin of staging (make create-admin)
#   E2E_STAGING_ADMIN_PASSWORD its password
# The tests make their own users, topics and questions, with unique names, and
# staging keeps them (reset staging when it becomes untidy).
on:
  schedule:
    - cron: '30 1 * * 0'
  workflow_dispatch:
    inputs:
      grep:
        description: Only tests matching this (e.g. @smoke, E2E-RW)
        required: false
        default: '@smoke'

permissions:
  contents: read

concurrency:
  group: e2e-staging
  cancel-in-progress: false

jobs:
  e2e-staging:
    name: Browser tests (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_BASE_URL: ${{ secrets.E2E_STAGING_BASE_URL }}
      E2E_ADMIN_URL: ${{ secrets.E2E_STAGING_ADMIN_URL }}
      E2E_MAILPIT_URL: ${{ secrets.E2E_STAGING_MAILPIT_URL }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_STAGING_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_STAGING_ADMIN_PASSWORD }}
      # The weekly run does everything; a manual run says what.
      E2E_GREP: ${{ inputs.grep || '.' }}
    steps:
      - name: The secrets are set
        run: |
          for name in E2E_BASE_URL E2E_ADMIN_URL E2E_MAILPIT_URL E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::The repository secret E2E_STAGING_${name#E2E_} is not set (see the header of this workflow)"; exit 1; }
          done
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run the tests
        run: npx playwright test --grep "$E2E_GREP"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
