# Dependency updates, once a week, in few pull requests: one for the minor and patch updates of a kind, a pull
# request of its own for a major one. Each pull request runs CI. The security alerts (Settings > Code security) are
# separate and need no minutes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "02:00", timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 3
    commit-message: { prefix: "chore(deps)" }
    groups:
      npm-minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "02:00", timezone: Asia/Ho_Chi_Minh }
    commit-message: { prefix: "chore(ci)" }
    groups:
      actions: { patterns: ["*"] }
